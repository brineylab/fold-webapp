<div class="relative" data-dropdown>
  <button
    type="button"
    class="ui-sidebar-footer-trigger"
    data-dropdown-trigger
    aria-expanded="false"
    data-tooltip="{{ user.username }}"
  >
    <span class="ui-sidebar-footer-avatar" aria-hidden="true">
      {{ user.username|first|upper }}
    </span>
    <span class="ui-sidebar-footer-identity">
      <span class="ui-sidebar-footer-name">{{ user.username }}</span>
      <span class="ui-sidebar-footer-email">{{ user.email|default:"No email set" }}</span>
    </span>
    <svg class="ui-sidebar-footer-chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
      <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708"/>
    </svg>
  </button>

  <div class="hidden ui-sidebar-footer-menu" data-dropdown-menu>
    <div class="ui-sidebar-footer-menu-header">
      <div class="ui-sidebar-footer-name">{{ user.username }}</div>
      <div class="ui-sidebar-footer-email">{{ user.email|default:"No email set" }}</div>
    </div>

    <div class="ui-sidebar-footer-menu-section">
      <a href="{% url 'account' %}" class="ui-sidebar-item {% if request.resolver_match.namespace != 'console' and request.resolver_match.url_name == 'account' %}ui-sidebar-item-active{% endif %}">
        <span>Account</span>
      </a>
    </div>

    <div class="ui-sidebar-footer-menu-section">
      <div class="ui-sidebar-footer-menu-label">Theme</div>
      <button class="ui-sidebar-item w-full text-left" data-theme-value="light">
        <span>Light</span>
      </button>
      <button class="ui-sidebar-item w-full text-left" data-theme-value="dark">
        <span>Dark</span>
      </button>
      <button class="ui-sidebar-item w-full text-left" data-theme-value="auto">
        <span>System</span>
      </button>
    </div>

    <div class="ui-sidebar-footer-menu-section">
      <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="ui-sidebar-item w-full text-left">
          <span>Logout</span>
        </button>
      </form>
    </div>
  </div>
</div>
