{# Non-field error list
   Usage: {% include "components/forms/error_list.html" with errors=form.non_field_errors %}
#}
{% if errors %}
<div class="ui-alert ui-alert-danger mb-4" role="alert">
  <ul class="list-disc pl-5 mb-0">
    {% for error in errors %}<li>{{ error }}</li>{% endfor %}
  </ul>
</div>
{% endif %}
