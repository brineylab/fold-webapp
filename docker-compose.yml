services:
  # Run database migrations before starting other services
  migrate:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    command: sh -lc "umask 000 && python manage.py migrate --noinput"
    env_file: .env
    environment:
      - DATA_DIR=${DATA_DIR:-/tmp/fold-webapp-data}
      - DATABASE_PATH=${DATA_DIR:-/tmp/fold-webapp-data}/db/db.sqlite3
      - JOB_BASE_DIR=${DATA_DIR:-/tmp/fold-webapp-data}/jobs
      - HARNESS_BASE_DIR=${DATA_DIR:-/tmp/fold-webapp-data}/harness
    volumes:
      - ${DATA_DIR:-/tmp/fold-webapp-data}:${DATA_DIR:-/tmp/fold-webapp-data}
    # Only run once, then exit
    restart: "no"

  # Main web application
  web:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    user: "0:0"
    command: sh -lc "umask 000 && gunicorn bioportal.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATA_DIR=${DATA_DIR:-/tmp/fold-webapp-data}
      - DATABASE_PATH=${DATA_DIR:-/tmp/fold-webapp-data}/db/db.sqlite3
      - JOB_BASE_DIR=${DATA_DIR:-/tmp/fold-webapp-data}/jobs
      - HARNESS_BASE_DIR=${DATA_DIR:-/tmp/fold-webapp-data}/harness
    volumes:
      - ${DATA_DIR:-/tmp/fold-webapp-data}:${DATA_DIR:-/tmp/fold-webapp-data}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Background job worker (dispatch + reconciliation loop)
  worker:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    user: "0:0"
    command: sh -lc "umask 000 && python manage.py run_job_worker --interval 10"
    env_file: .env
    environment:
      - DATA_DIR=${DATA_DIR:-/tmp/fold-webapp-data}
      - DATABASE_PATH=${DATA_DIR:-/tmp/fold-webapp-data}/db/db.sqlite3
      - JOB_BASE_DIR=${DATA_DIR:-/tmp/fold-webapp-data}/jobs
      - HARNESS_BASE_DIR=${DATA_DIR:-/tmp/fold-webapp-data}/harness
    volumes:
      - ${DATA_DIR:-/tmp/fold-webapp-data}:${DATA_DIR:-/tmp/fold-webapp-data}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
