services:
  # Run database migrations before starting other services
  migrate:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    command: sh -lc "umask 000 && python manage.py migrate --noinput"
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - DATABASE_PATH=/app/data/db/db.sqlite3
      - JOB_BASE_DIR=/app/data/jobs
    volumes:
      - ${DATA_DIR:-./data}/db:/app/data/db
      - ${DATA_DIR:-./data}/jobs:/app/data/jobs
      - ${HARNESS_BASE_DIR_HOST:-./data/harness}:/app/data/harness
    # Only run once, then exit
    restart: "no"

  # Main web application
  web:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    command: sh -lc "umask 000 && gunicorn bioportal.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - DATABASE_PATH=/app/data/db/db.sqlite3
      - JOB_BASE_DIR=/app/data/jobs
    volumes:
      - ${DATA_DIR:-./data}/db:/app/data/db
      - ${DATA_DIR:-./data}/jobs:/app/data/jobs
      - ${HARNESS_BASE_DIR_HOST:-./data/harness}:/app/data/harness
      - static_files:/app/staticfiles
      # Uncomment below to mount SLURM binaries from host (production only)
      # - /usr/bin/sbatch:/usr/bin/sbatch:ro
      # - /usr/bin/squeue:/usr/bin/squeue:ro
      # - /usr/bin/sacct:/usr/bin/sacct:ro
      # - /usr/bin/scancel:/usr/bin/scancel:ro
      # - /usr/bin/scontrol:/usr/bin/scontrol:ro
      # - /etc/slurm:/etc/slurm:ro
      # - /var/run/munge:/var/run/munge:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Background job worker (dispatch + reconciliation loop)
  poller:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    command: sh -lc "umask 000 && python manage.py run_job_worker --interval 10"
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - DATABASE_PATH=/app/data/db/db.sqlite3
      - JOB_BASE_DIR=/app/data/jobs
    volumes:
      - ${DATA_DIR:-./data}/db:/app/data/db
      - ${DATA_DIR:-./data}/jobs:/app/data/jobs
      - ${HARNESS_BASE_DIR_HOST:-./data/harness}:/app/data/harness
      # Uncomment below only if you explicitly enable the legacy SLURM fallback
      # - /usr/bin/squeue:/usr/bin/squeue:ro
      # - /usr/bin/sacct:/usr/bin/sacct:ro
      # - /usr/bin/scancel:/usr/bin/scancel:ro
      # - /usr/bin/scontrol:/usr/bin/scontrol:ro
      # - /etc/slurm:/etc/slurm:ro
      # - /var/run/munge:/var/run/munge:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  static_files:
