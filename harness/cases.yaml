  - id: extended-boltzgen-peptide
    tier: extended
    model_key: boltzgen
    transport: prepare_only
    timeout_sec: 300
    requires: []
    fields:
      name: Harness BoltzGen Peptide
      protocol: peptide-anything
      target_chains: A
      peptide_length_min: 8
      peptide_length_max: 12
      num_designs: 2
      budget: 1
      alpha: 0.01
    files:
      target_file: common/structures/1LQ7.pdb
    expected_outputs: []
