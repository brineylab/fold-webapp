  - id: extended-rfdiffusion3-motif
    tier: extended
    model_key: rfdiffusion3
    transport: prepare_only
    timeout_sec: 300
    requires: []
    fields:
      name: Harness RFdiffusion3 Motif
      mode: motif
      num_designs: 1
      n_batches: 1
      motif_contig: A1-3,10,A4-6
      motif_length_min: 20
      motif_length_max: 25
    files:
      motif_input_pdb: common/structures/1LQ7.pdb
    expected_outputs: []

  - id: extended-rfdiffusion3-partial
    tier: extended
    model_key: rfdiffusion3
    transport: prepare_only
    timeout_sec: 300
    requires: []
    fields:
      name: Harness RFdiffusion3 Partial
      mode: partial
      num_designs: 1
      n_batches: 1
      partial_contig: A1-6
      partial_t: 5.0
    files:
      partial_input_pdb: common/structures/1LQ7.pdb
    expected_outputs: []

  - id: extended-rfdiffusion3-symmetric
    tier: extended
    model_key: rfdiffusion3
    transport: prepare_only
    timeout_sec: 300
    requires: []
    fields:
      name: Harness RFdiffusion3 Symmetric
      mode: symmetric
      num_designs: 1
      n_batches: 1
      sym_contig: 40-40
      sym_type: C2
    files: {}
    expected_outputs: []

  - id: extended-rfdiffusion3-json-upload
    tier: extended
    model_key: rfdiffusion3
    transport: prepare_only
    timeout_sec: 300
    requires: []
    fields:
      name: Harness RFdiffusion3 JSON Upload
      mode: json_upload
      num_designs: 1
      n_batches: 1
    files:
      input_json: rfdiffusion3/input_spec.json
    expected_outputs: []

